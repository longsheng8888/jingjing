name: Build iOS Deb

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile App Binary
        run: |
          xcrun -sdk iphoneos swiftc App/main.swift -o TestApp -target arm64-apple-ios14.0
          mkdir -p Applications/TestApp.app
          mv TestApp Applications/TestApp.app/TestApp

      - name: Create Info.plist
        run: |
          cat << 'EOF' > Applications/TestApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>TestApp</string>
              <key>CFBundleIdentifier</key><string>com.yourname.testapp</string>
              <key>CFBundleName</key><string>TestApp</string>
              <key>CFBundleVersion</key><string>1.0</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>MinimumOSVersion</key><string>14.0</string>
          </dict>
          </plist>
          EOF

      - name: Create DEBIAN/control
        run: |
          mkdir -p DEBIAN
          cat << 'EOF' > DEBIAN/control
          Package: com.yourname.testapp
          Name: TestApp
          Version: 1.0
          Architecture: iphoneos-arm64
          Description: 测试APP
          Maintainer: yourname
          Author: yourname
          Section: Applications
          EOF

      - name: Build Deb
        run: |
          brew install dpkg
          # 下面这行加了 --build 参数，并且只打包这两个文件夹，排除了所有源码！
          dpkg-deb --build --root-owner-group Applications DEBIAN testapp.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestApp-Deb
          path: testapp.deb
