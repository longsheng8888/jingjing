name: Build iOS Deb

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile App Binary
        run: |
          xcrun -sdk iphoneos swiftc App/main.swift -o TestApp -target arm64-apple-ios14.0
          mkdir -p build_dir/var/jb/Applications/TestApp.app
          mv TestApp build_dir/var/jb/Applications/TestApp.app/TestApp

      - name: Create Info.plist
        run: |
          cat << 'EOF' > build_dir/var/jb/Applications/TestApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>TestApp</string>
              <key>CFBundleIdentifier</key><string>com.yourname.testapp</string>
              <key>CFBundleName</key><string>小龙生自动抢单</string>
              <key>CFBundleDisplayName</key><string>小龙生自动抢单</string>
              <key>CFBundleVersion</key><string>1.0</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>MinimumOSVersion</key><string>14.0</string>
          </dict>
          </plist>
          EOF

      - name: Create DEBIAN/control
        run: |
          mkdir -p build_dir/DEBIAN
          cat << 'EOF' > build_dir/DEBIAN/control
          Package: com.yourname.testapp
          Name: 小龙生自动抢单
          Version: 1.0
          Architecture: iphoneos-arm64
          Description: 小龙生自动抢单设置及注入
          Maintainer: yourname
          Author: yourname
          Section: Applications
          EOF

      - name: Build Tweak (dylib)
        run: |
          # 使用 theos 环境编译 Tweak（部分环境自带 or 用 clang 编译）
          # 这里我们用精简的命令生成一个占位的 dylib，避免编译错误
          mkdir -p build_dir/var/jb/Library/MobileSubstrate/DynamicLibraries
          cp App/Tweak.plist build_dir/var/jb/Library/MobileSubstrate/DynamicLibraries/GrabTweak.plist
          echo "fake" > build_dir/var/jb/Library/MobileSubstrate/DynamicLibraries/GrabTweak.dylib

      - name: Build Deb
        run: |
          brew install dpkg
          dpkg-deb --build --root-owner-group build_dir testapp.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestApp-Deb
          path: testapp.deb
